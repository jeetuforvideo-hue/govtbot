name: GovtVibhag Auto Content Writer

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-govt-writer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install required libraries
        run: pip install requests beautifulsoup4 lxml pymupdf

      - name: Run Content Writer Script
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_POST_STATUS: draft
          MAX_NOTICE_AGE_HOURS: "2"
          POST_RUN_ONLY: "true"
          ENABLE_FALLBACK: "true"
          MIN_ARTICLE_WORDS: "1050"
        run: python gov_vibhaf_master.py

      - name: Save database state to repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add scraped_data_cache/govtvibhag_latest.db || true
          git diff --staged --quiet || (git commit -m "Update bot database state" && git push)
