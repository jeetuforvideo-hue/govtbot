name: GovtVibhag 24/7 Bot

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pymupdf

      - name: Run Bot Script
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python gov_vibhaf_master.py

      - name: Save Updated Database Safely
        run: |
          git config --global user.name "GovtBot Auto"
          git config --global user.email "bot@govtvibhag.com"
          git add govt_vibhag_master.db
          git diff --staged --quiet || (git commit -m "Auto-update database after scan" && git pull --rebase origin main || echo "Rebase skipped" && git push origin main || echo "Push skipped")
